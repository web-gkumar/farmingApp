<mat-card appearance="outlined">
  <!-- <mat-card-header><mat-card-title>Create Post</mat-card-title></mat-card-header> -->

  <mat-card-content>
    <form [formGroup]="orderForm">
      <mat-radio-group formControlName="purpose">
        <mat-radio-button value="buy">For Buyer</mat-radio-button>
        <mat-radio-button value="sell">For Seller</mat-radio-button>
      </mat-radio-group> <br><br>

      <mat-form-field appearance="outline"><mat-label>Enter Crop Name</mat-label><input matInput placeholder="Gobhi/Tamater/Aalu" formControlName="cropName"></mat-form-field>

      <mat-form-field appearance="outline"><mat-label>Enter Price</mat-label><input matInput placeholder="40-45" formControlName="price"></mat-form-field>

      <mat-form-field appearance="outline"><mat-label>Enter Quantity</mat-label><input matInput placeholder="100 kg" formControlName="quantity"></mat-form-field>

      <mat-form-field appearance="outline"><mat-label>Enter Delivery Date</mat-label><input matInput type="date" formControlName="deliveryDate"></mat-form-field>
    </form>
  </mat-card-content>

  <mat-card-actions>
    <button matButton routerLink="/profile">Cancel</button>
    @if(urlId){
    <button matButton="tonal" (click)="updateOrder()">Update Order</button>
    }@else {
    <button matButton="tonal" (click)="submitOrder()">Add Order</button>
    }
  </mat-card-actions>
</mat-card>
