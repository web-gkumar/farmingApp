<div class="header">
    <div class="avatar"><img src="/avatar.png" width="100%" height="100%" alt="Avatar"></div>
    <div class="user-info">
        <h2>{{ user?.name || 'User Name' }}</h2>
        <p>{{ user?.mobile || 'Phone Number' }}</p>
        <p class="email">{{ user?.email || 'Email Address' }}</p>
    </div>
</div>
<nav class="tabs">
    <a routerLink="orders" routerLinkActive="active">ORDERS</a>
    <a routerLink="favorites" routerLinkActive="active">FAVORITE</a>
    <a routerLink="about" routerLinkActive="active">ABOUT</a>
</nav>
<router-outlet></router-outlet>
